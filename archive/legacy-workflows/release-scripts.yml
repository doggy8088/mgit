name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release'
        required: true
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4

      - name: Set Tag Name
        id: vars
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag_name=$INPUT_TAG_NAME" >> $GITHUB_OUTPUT
          else
            echo "tag_name=$REF_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Create Git Tag (if manual)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "${{ steps.vars.outputs.tag_name }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.vars.outputs.tag_name }} already exists."
          else
            git tag "${{ steps.vars.outputs.tag_name }}"
            git push origin "${{ steps.vars.outputs.tag_name }}"
          fi

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@c95fe1489396fe8a9a4aa8985111238e79bfe947 # v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: ${{ steps.vars.outputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            mgit
            mgit.ps1
