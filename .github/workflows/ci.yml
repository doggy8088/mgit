name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  lint:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo clippy (host)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo clippy (Windows)
        run: cargo clippy --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: [formatting, lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --all-targets --locked

      - name: Smoke test the binary (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet -- --version
          cargo run --quiet -- --help > /dev/null

      - name: Smoke test the binary (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo run --quiet -- --version
          cargo run --quiet -- --help | Out-Null

  msrv:
    name: Minimum supported Rust version
    needs: [formatting, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install the oldest supported Rust
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo test with the declared rust-version
        run: cargo test --all-targets --locked

  coverage:
    name: Coverage
    needs: [formatting, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Measure the coverage
        run: cargo llvm-cov --all-targets --locked --lcov --output-path lcov.info --fail-under-lines 85

      - name: Write the summary
        if: always()
        run: cargo llvm-cov report --summary-only >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: ignore

  cross-check:
    name: Cross compile check (${{ matrix.target }})
    needs: [formatting, lint]
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --locked --target ${{ matrix.target }}

  installers:
    name: Installer (${{ matrix.os }})
    needs: [formatting, lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build the release binary
        run: cargo build --release --locked

      - name: Package a release for the local server (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          target=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p dist staging
          cp target/release/mgit staging/mgit
          tar -czf "dist/mgit-${target}.tar.gz" -C staging mgit
          if command -v sha256sum > /dev/null 2>&1; then
            (cd dist && sha256sum "mgit-${target}.tar.gz" > "mgit-${target}.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "mgit-${target}.tar.gz" > "mgit-${target}.tar.gz.sha256")
          fi
          echo "target=${target}" >> "$GITHUB_ENV"

      - name: Package a release for the local server (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = (rustc -vV | Select-String '^host: ').ToString().Replace('host: ', '').Trim()
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path target/release/mgit.exe -DestinationPath "dist/mgit-$target.zip" -Force
          $hash = (Get-FileHash "dist/mgit-$target.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  mgit-$target.zip" | Out-File -Encoding ascii "dist/mgit-$target.zip.sha256"
          "target=$target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: Install with install.sh and install.ps1 (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8731 --bind 127.0.0.1 --directory dist &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do
            if curl -fsS -o /dev/null "http://127.0.0.1:8731/"; then break; fi
            sleep 0.5
          done

          sh ./install.sh --download-base http://127.0.0.1:8731 --dir "$RUNNER_TEMP/mgit-sh" --version 0.1.0
          "$RUNNER_TEMP/mgit-sh/mgit" --version

          pwsh -NoProfile -File ./install.ps1 -DownloadBase http://127.0.0.1:8731 -InstallDir "$RUNNER_TEMP/mgit-ps" -Version 0.1.0
          "$RUNNER_TEMP/mgit-ps/mgit" --version

          # A tampered archive must never be installed.
          printf 'tampered\n' >> dist/*.tar.gz
          if sh ./install.sh --download-base http://127.0.0.1:8731 --dir "$RUNNER_TEMP/mgit-bad" --version 0.1.0; then
            echo '::error::install.sh accepted a tampered archive'
            exit 1
          fi

      - name: Install with install.ps1 (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $server = Start-Process -FilePath python -PassThru -ArgumentList @(
            '-m', 'http.server', '8731', '--bind', '127.0.0.1', '--directory', 'dist'
          )
          try {
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              try {
                Invoke-WebRequest -Uri 'http://127.0.0.1:8731/' -UseBasicParsing -ErrorAction Stop | Out-Null
                break
              }
              catch {
                Start-Sleep -Milliseconds 500
              }
            }
            ./install.ps1 -DownloadBase 'http://127.0.0.1:8731' -InstallDir "$env:RUNNER_TEMP/mgit-ps" -Version 0.1.0
            & "$env:RUNNER_TEMP/mgit-ps/mgit.exe" --version

            # A tampered archive must never be installed.
            Get-ChildItem dist/*.zip | ForEach-Object {
              Add-Content -LiteralPath $_.FullName -Value 'tampered'
            }
            $failed = $false
            try {
              ./install.ps1 -DownloadBase 'http://127.0.0.1:8731' -InstallDir "$env:RUNNER_TEMP/mgit-bad" -Version 0.1.0
            }
            catch {
              $failed = $true
            }
            if (-not $failed) {
              Write-Error 'install.ps1 accepted a tampered archive'
              exit 1
            }
          }
          finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

  scripts:
    name: Script checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: shellcheck
        run: shellcheck --version && shellcheck install.sh scripts/*.sh

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color -shellcheck= -pyflakes=
