[package]
name = "mgit"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
description = "Run the same git command in every Git repository under the current directory"
repository = "https://github.com/doggy8088/mgit"
homepage = "https://github.com/doggy8088/mgit"
license = "MIT"
readme = "README.md"
keywords = ["git", "cli", "multi-repo", "git-status", "productivity"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["archive/", ".github/", "scripts/"]

[lib]
name = "mgit"
path = "src/lib.rs"

[[bin]]
name = "mgit"
path = "src/main.rs"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3"
